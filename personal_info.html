<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人資訊填寫</title>
<link rel="stylesheet" href="assets/mf_style.css?v=20261023b">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="assets/mf_common.js?v=20261023b"></script>
</head>
<body>
<div class="mf-wrap">
  <div class="mf-header">
    <div class="mf-brand">MONEYFREE</div>
    <h1 class="mf-title">個人財務資訊</h1>
    <p class="mf-sub">填寫後專員可更精準為你規劃,可隨時回來修改</p>
  </div>
  <div id="mf_loading" class="mf-loading"><div class="mf-spinner"></div>載入中…</div>
  <form id="mf_form" class="mf-hidden" autocomplete="off"></form>
</div>
<script>
// [區塊標題, [[欄位代號, 標籤, 類型, 選項或提示]]]
const MF_SECTIONS = [
  ['基本資料', [
    ['name', '姓名', 'text'], ['phone', '聯絡電話', 'tel'],
    ['age', '年齡區間', 'select', ['20 歲以下', '20–29', '30–39', '40–49', '50–59', '60 歲以上']],
    ['job', '職業', 'text'],
    ['family', '家庭狀況', 'select', ['單身', '已婚無子女', '已婚有子女', '單親', '其他']],
    ['dependents', '扶養人數', 'select', ['0', '1', '2', '3', '4 人以上']],
  ]],
  ['收入與支出(每月,約略即可)', [
    ['income', '月收入', 'select', ['3 萬以下', '3–5 萬', '5–8 萬', '8–12 萬', '12–20 萬', '20 萬以上']],
    ['side_income', '其他收入(兼職、租金、股息等)', 'text', '例:租金 1.5 萬/月'],
    ['expense', '月支出', 'select', ['2 萬以下', '2–4 萬', '4–6 萬', '6–10 萬', '10 萬以上']],
    ['saving_rate', '每月可存下', 'select', ['幾乎存不了', '收入 10% 以下', '10–20%', '20–40%', '40% 以上']],
  ]],
  ['資產', [
    ['cash', '存款 / 現金', 'text', '例:約 50 萬'],
    ['stocks', '股票 / ETF', 'text'], ['funds', '基金', 'text'],
    ['insurance_saving', '儲蓄型 / 投資型保單', 'text'],
    ['real_estate', '不動產', 'text', '例:自住一戶,市值約 1,200 萬'],
    ['other_assets', '其他資產(外幣、黃金、加密貨幣等)', 'text'],
  ]],
  ['負債', [
    ['mortgage', '房貸', 'text', '例:餘額 800 萬,月付 3.5 萬'],
    ['car_loan', '車貸 / 信貸', 'text'], ['card_debt', '信用卡循環 / 分期', 'text'],
  ]],
  ['保障', [
    ['protection', '現有保障(壽險、醫療、意外、長照等)', 'textarea'],
  ]],
  ['目標與偏好', [
    ['goals', '財務目標', 'textarea', '例:5 年內買房、10 年後退休月領 5 萬'],
    ['risk', '投資風險偏好', 'select', ['保守:不能接受虧損', '穩健:可接受小幅波動', '積極:可承受較大波動以換取成長']],
    ['experience', '投資經驗', 'select', ['沒有', '1–3 年', '3–10 年', '10 年以上']],
    ['contact_time', '方便聯絡時段', 'select', ['平日白天', '平日晚上', '週末', '皆可']],
    ['notes', '想跟專員說的話', 'textarea'],
  ]],
];

function mfBuildForm() {
  const html = MF_SECTIONS.map(([title, fields]) => `<div class="mf-card"><h2>${title}</h2>${fields.map(([k, label, type, extra]) => {
    const id = `mf_f_${k}`;
    if (type === 'select') {
      return `<label class="mf-field">${label}<select id="${id}" name="${k}"><option value="">請選擇</option>${extra.map((o) => `<option>${o}</option>`).join('')}</select></label>`;
    }
    if (type === 'textarea') return `<label class="mf-field">${label}<textarea id="${id}" name="${k}" maxlength="500" placeholder="${extra || ''}"></textarea></label>`;
    return `<label class="mf-field">${label}<input id="${id}" name="${k}" type="${type}" maxlength="200" placeholder="${extra || ''}"></label>`;
  }).join('')}</div>`).join('');
  document.getElementById('mf_form').innerHTML = `${html}
    <div class="mf-card">
      <label class="mf-check"><input type="checkbox" id="mf_consent">我同意將以上資料提供給服務專員,僅用於財務諮詢與規劃。</label>
      <div id="mf_err" class="mf-error"></div>
      <button type="submit" class="mf-btn" style="margin-top:14px" id="mf_save">儲存資料</button>
      <button type="button" class="mf-btn mf-ghost" onclick="mfClose()">關閉</button>
      <p class="mf-note" id="mf_updated"></p>
    </div>`;
}

function mfFill(mfData) {
  Object.entries(mfData || {}).forEach(([k, v]) => {
    const el = document.getElementById(`mf_f_${k}`);
    if (el) el.value = v;
  });
}

mfBuildForm();
document.getElementById('mf_form').onsubmit = async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('mf_err');
  errEl.textContent = '';
  if (!document.getElementById('mf_consent').checked) { errEl.textContent = '請先勾選同意提供資料'; return; }
  const data = {};
  new FormData(e.target).forEach((v, k) => { if (String(v).trim()) data[k] = String(v).trim(); });
  if (!data.name || !data.phone) { errEl.textContent = '請至少填寫姓名與聯絡電話'; return; }
  const btn = document.getElementById('mf_save');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    const r = await mfApi('personal_save', { data });
    mfToast(r.mfPreview ? '預覽模式不會儲存' : '已儲存,專員會盡快與你聯繫');
    document.getElementById('mf_updated').textContent = `最後更新:${new Date().toLocaleString('zh-TW')}`;
  } catch (err) { errEl.textContent = err.message; }
  btn.disabled = false; btn.textContent = '儲存資料';
};

(async () => {
  try {
    await mfInit(MF_CONFIG.liffFull);
    const r = await mfApi('personal_get');
    if (r.record) {
      mfFill(r.record.data);
      document.getElementById('mf_consent').checked = true;
      document.getElementById('mf_updated').textContent = `最後更新:${new Date(r.record.updated_at).toLocaleString('zh-TW')}`;
    }
  } catch (err) {
    setTimeout(() => { document.getElementById('mf_err').textContent = err.message; });
  }
  mfShow('mf_loading', false); mfShow('mf_form');
})();
</script>
</body>
</html>
