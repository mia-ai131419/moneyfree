<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>MoneyFree 圖文選單原稿</title>
<!-- 圖文選單原稿:以 2500x1686 截圖輸出為 assets/richmenu.jpg -->
<style>
  html, body { margin: 0; width: 2500px; height: 1686px; font-family: "WenQuanYi Zen Hei", "Noto Sans TC", sans-serif; }
  .mf-grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%;
    background: linear-gradient(150deg, #c9d2d7 0%, #bcc6cc 55%, #aab5bc 100%); gap: 0;
  }
  .mf-cell {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 6px solid #ccddff; margin: -3px; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%);
  }
  .mf-icon {
    width: 300px; height: 300px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #e3c766 0%, #c9a227 60%, #a8841a 100%); box-shadow: 0 16px 40px rgba(122,95,12,.35);
    border: 10px solid #ccddff;
  }
  .mf-icon svg { width: 160px; height: 160px; fill: none; stroke: #22324d; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .mf-label { margin-top: 36px; font-size: 118px; font-weight: 700; color: #22324d; letter-spacing: 6px; }
  .mf-sub { margin-top: 24px; font-size: 108px; color: #7a5f0c; letter-spacing: 4px; }
</style>
</head>
<body>
<div class="mf-grid">
  <div class="mf-cell">
    <div class="mf-icon"><svg viewBox="0 0 100 100"><path d="M50 85 C20 62 12 45 20 30 C28 16 45 18 50 32 C55 18 72 16 80 30 C88 45 80 62 50 85Z"/><path d="M22 52 H38 L44 42 L52 62 L58 52 H78"/></svg></div>
    <div class="mf-label">健康大數據檢測</div><div class="mf-sub">拍照 AI 氣色分析</div>
  </div>
  <div class="mf-cell">
    <div class="mf-icon"><svg viewBox="0 0 100 100"><path d="M15 85 H85"/><path d="M25 75 V55"/><path d="M42 75 V40"/><path d="M59 75 V48"/><path d="M76 75 V25"/><path d="M20 40 L42 25 L58 34 L82 14"/></svg></div>
    <div class="mf-label">財務健康度檢測</div><div class="mf-sub">2 分鐘理財性格測驗</div>
  </div>
  <div class="mf-cell">
    <div class="mf-icon"><svg viewBox="0 0 100 100"><rect x="22" y="14" width="56" height="72" rx="6"/><path d="M34 34 H66"/><path d="M34 50 H66"/><path d="M34 66 H54"/></svg></div>
    <div class="mf-label">個人資訊填寫</div><div class="mf-sub">讓專員更懂你</div>
  </div>
  <div class="mf-cell">
    <div class="mf-icon"><svg viewBox="0 0 100 100"><path d="M18 26 H82 V66 H48 L30 80 V66 H18 Z"/><circle cx="36" cy="46" r="2"/><circle cx="50" cy="46" r="2"/><circle cx="64" cy="46" r="2"/></svg></div>
    <div class="mf-label">聯絡專員</div><div class="mf-sub">一對一諮詢</div>
  </div>
</div>
</body>
</html>
